<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BuildPro — 60s Executive Explainer</title>
    <style>
      /* BuildPro brand tokens — Progressive palette. Source of truth:
         ~/Documents/GitHub/buildpro/server/src/brand.ts (see DESIGN.md). */
      :root {
        --blue-700: #0077b3;
        --blue-900: #2862a4;
        --blue-500: #4ebee5;
        --blue-100: #f3f9fc;
        --steel-900: #0a3360;
        --steel-700: #405e7c;
        --steel-300: #d1e2e5;
        --steel-100: #f4f9fa;
        --gray-900: #2d2d2d;
        --gray-700: #707070;
        --green-900: #067462;
        --green-700: #08caa9;
        --green-100: #effbf7;
        --yellow-900: #a86800;
        --yellow-700: #efab00;
        --yellow-100: #fff8e5;
        --red-700: #d41659;
        --red-100: #fceff2;
        --font-display: "Inter Tight", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        background: #f4f9fa;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--steel-100);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="buildpro-explainer"
      data-start="0"
      data-duration="62"
      data-width="1920"
      data-height="1080"
    >
      <!-- Beat 1 — Shadow builds (0..10s) -->
      <div
        id="clip-beat-1"
        class="clip"
        data-composition-id="buildpro-beat-1"
        data-composition-src="compositions/beat-1-shadow.html"
        data-start="0"
        data-duration="10.2"
        data-track-index="0"
      ></div>

      <!-- Beat 2 — Enrollment (10..22s) -->
      <div
        id="clip-beat-2"
        class="clip"
        data-composition-id="buildpro-beat-2"
        data-composition-src="compositions/beat-2-enroll.html"
        data-start="10.2"
        data-duration="11.8"
        data-track-index="0"
      ></div>

      <!-- Beat 3 — The policy fork (22..37.5s) -->
      <div
        id="clip-beat-3"
        class="clip"
        data-composition-id="buildpro-beat-3"
        data-composition-src="compositions/beat-3-fork.html"
        data-start="22"
        data-duration="17"
        data-track-index="0"
      ></div>

      <!-- Beat 4 — Zero-effort tracking (37.5..49s) -->
      <div
        id="clip-beat-4"
        class="clip"
        data-composition-id="buildpro-beat-4"
        data-composition-src="compositions/beat-4-tracking.html"
        data-start="39"
        data-duration="12"
        data-track-index="0"
      ></div>

      <!-- Beat 5 — The packet / CTA (49..60s) -->
      <div
        id="clip-beat-5"
        class="clip"
        data-composition-id="buildpro-beat-5"
        data-composition-src="compositions/beat-5-cta.html"
        data-start="51"
        data-duration="11"
        data-track-index="0"
      ></div>

      <!-- Per-line narration (ElevenLabs "Sarah", eleven_multilingual_v2).
           Measured durations: line-1=8.59s, line-2=10.21s, line-3=15.33s,
           line-4=11.01s, line-5=8.21s. Each starts 0.4s into its beat. -->
      <audio
        id="narration-line-1"
        data-start="0.4"
        data-duration="8.59"
        data-track-index="1"
        data-volume="1.0"
        src="narration/lines/line-1.mp3"
      ></audio>
      <audio
        id="narration-line-2"
        data-start="10.6"
        data-duration="10.21"
        data-track-index="1"
        data-volume="1.0"
        src="narration/lines/line-2.mp3"
      ></audio>
      <audio
        id="narration-line-3"
        data-start="22.4"
        data-duration="15.32"
        data-track-index="1"
        data-volume="1.0"
        src="narration/lines/line-3.mp3"
      ></audio>
      <audio
        id="narration-line-4"
        data-start="39.4"
        data-duration="11.0"
        data-track-index="1"
        data-volume="1.0"
        src="narration/lines/line-4.mp3"
      ></audio>
      <audio
        id="narration-line-5"
        data-start="51.4"
        data-duration="8.21"
        data-track-index="1"
        data-volume="1.0"
        src="narration/lines/line-5.mp3"
      ></audio>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      // Root timeline is a paused stub — each beat owns its child timeline.
      window.__timelines = window.__timelines || {};
      window.__timelines["buildpro-explainer"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
